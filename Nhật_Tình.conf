#!desc=Được tổng hợp và tùy chỉnh bởi Nhật Tình
#!author=Nhật_Tình
#!configUrl=https://raw.githubusercontent.com/nhattinh486-art/Module_IOS/refs/heads/main/Nhật_Tình.conf
